<script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.6.0/dist/aframe-master.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

<style>
  .arjs-loader {
    height: 100%;
    width: 100%;
    position: absolute;
    top: 0;
    left: 0;
    background-color: rgba(0, 0, 0, 0.8);
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .arjs-loader div {
    text-align: center;
    font-size: 1.25em;
    color: white;
  }
</style>

<!--<script src='../../../../aframe/build/aframe-ar-nft.js'></script>-->
<canvas id="arjs-canvas" style="position: absolute; top: 0; left: 0;"></canvas>

<body style='margin : 0px; overflow: hidden;'>
   <!-- Test 3 minimal loader shown until image descriptors are loaded -->
  <div class="arjs-loader">
    <div>Loading, please wait...</div>
  </div>
    <a-scene
        vr-mode-ui='enabled: false;'
        renderer="logarithmicDepthBuffer: true; precision: medium;"
        embedded arjs='trackingMethod: best; sourceType: webcam; debugUIEnabled: false;'
        inspector keyboard-shortcuts screenshot device-orientation-permission-ui>
        <!-- use rawgithack to retrieve the correct url for nft marker (see 'pinball' below) -->
        <a-nft 
            type="nft" 
            url="./trex/trex-image/trexV2" 
            smooth="true" smoothcount="10" smoothtolerance="0.01" smooththreshold="5" material="" arjs-anchor="" arjs-hit-testing="">
            <a-entity
                gltf-model='./trex/scene.gltf'
                scale="5 5 5"
                position="150 300 -100"
                >
            </a-entity>
        </a-nft>
		  <a-entity camera></a-entity>
      <canvas class="a-canvas" data-aframe-canvas="true" data-engine="three.js r137" width="1918" height="1438"></canvas>
      <a-entity light="" data-aframe-default-light="" aframe-injected=""></a-entity>
      <a-entity light="" position="" data-aframe-default-light="" aframe-injected=""></a-entity>
    </a-scene>
    <video autoplay="" muted="" playsinline="" id="arjs-video" style="width: 609px; height: 812px; position: absolute; top: 0px; left: 0px; z-index: -2; margin-left: -99px; margin-top: 0px;"></video>
    <script>
      fetch('./trex/trex-image/trex.fset')
        .then(response => console.log('NFT files found:', response.status))
        .catch(error => console.error('NFT files missing:', error));
      
        // Remove loading screen manually if AR.js doesn't do it
      setTimeout(() => {
          const loader = document.querySelector('.arjs-loader');
          if (loader) {
              loader.style.display = 'none';
          }
      }, 10000); // Remove after 10 seconds max

      // Also listen for AR.js events
      document.addEventListener('arjs-nft-loaded', () => {
          console.log('NFT loaded successfully');
          const loader = document.querySelector('.arjs-loader');
          if (loader) loader.style.display = 'none';
      });
    </script>
</body>
