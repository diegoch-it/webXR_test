<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR.js Image Tracking Demo</title>
    
    <!-- AR.js and A-Frame libraries -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar-nft.js"></script>
    
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            z-index: 9999;
        }
        
        #instructions {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 1000;
            text-align: center;
        }
        
        #debug {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            max-width: 300px;
            z-index: 1000;
        }
    </style>
</head>

<body>
    <!-- Loading indicator -->
    <div id="loading">
        <h2>Loading AR Experience...</h2>
        <p>Point your camera at the target image when ready</p>
    </div>
    
    <!-- Instructions -->
    <div id="instructions" style="display: none;">
        Point camera at target image
    </div>
    
    <!-- Debug info -->
    <div id="debug"></div>

    <a-scene
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false;">
        <!-- Add this simple box that should ALWAYS be visible -->
        <a-marker preset="hiro"
            <a-box 
                position="0 1.6 -3" 
                width="1" 
                height="0.5" 
                depth="1" 
                color="red" 
                animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
            </a-box>
        </a-marker>  
        <a-camera></a-camera>
    </a-scene>
    <script>
        // Wait for the A-Frame scene to load
        document.addEventListener('DOMContentLoaded', () => {
            const loadingElement = document.getElementById('loading');
            const instructionsElement = document.getElementById('instructions');
            const debugElement = document.getElementById('debug');
            
            // Simulate loading time
            setTimeout(() => {
                loadingElement.style.display = 'none';
                instructionsElement.style.display = 'block';
            }, 3000); // Simulate a 3-second loading time
            
            // Debug info (for demonstration purposes)
            debugElement.innerHTML = 'Debug Info: AR.js initialized successfully.';
        });
    </script>
</body>
</html>
